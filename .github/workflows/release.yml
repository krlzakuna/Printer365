name: Compilar y Publicar Printer365 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x Printer365App/gradlew

      - name: Compilar APK Debug
        run: |
          cd Printer365App
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Printer365.apk

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Printer365.apk
            version.json
          name: Printer365 ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

